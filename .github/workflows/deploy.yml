name: Deploy DisplayBoard

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sydneyapp

jobs:
  deploy:
    name: Deploy DisplayBoard → ${{ matrix.environment }}
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: ${{ fromJSON(inputs.environment == 'both' && '["sydneyapp"]' || format('["{0}"]', inputs.environment)) }}
    steps:
      - name: Stop the service
        run: |
          sudo --chdir=/home/nick/scripts/LightingControl /home/nick/scripts/pyutil/servicectrl.sh stop

      - name: Pull latest from GitHub
        run: |
          sudo --chdir=/home/pi/scripts/DisplayBoard /home/pi/scripts/pyutil/gitrefresh.sh --yes

      - name: Deploy and start the service
        run: sudo --chdir=/home/nick/scripts/DisplayBoard /home/nick/scripts/pyutil/servicectrl.sh deploy sydneyapp

      - name: Verify service is running
        run: |
          sleep 6
          sudo --chdir=/home/nick/scripts/DisplayBoard /home/nick/scripts/pyutil/servicectrl.sh is-active